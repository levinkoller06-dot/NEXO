<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXO</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><a class="brand" href="#">NEXO</a><span id="date" class="header-date"></span><time id="clock"></time></header>
<main>
<aside class="left">
<section class="panel"><div class="panel-title">BETRIEBSMODUS <span>03</span></div><div class="modes"><button data-mode="standby" class="selected"><span class="dot cyan"></span>Bereit<small>Ruhig & aufmerksam</small></button><button data-mode="focus"><span class="dot purple"></span>Fokus<small>Alles auf eine Aufgabe</small></button><button data-mode="energy"><span class="dot amber"></span>Energie<small>Schnell & dynamisch</small></button></div></section>
<section class="panel mini"><span class="eyebrow">RENDER ENGINE</span><div class="metric"><strong id="fps">60</strong><span>FPS <br>PARTICLE FACE</span></div><div class="bars" aria-hidden="true"></div></section>
</aside>
<section class="stage" id="stage"><div class="stage-top"><div><h2>NEXO <span id="mode-label">/ BEREIT</span></h2><span id="state" class="status-line" aria-live="polite">Bereit.</span></div><button id="expand" class="icon-button" title="Gesicht vergrößern" aria-label="Gesicht vergrößern">⛶</button></div><canvas id="face" aria-label="Animierter Kopf aus farbigen Lichtpunkten"></canvas><div class="stage-bottom"><div class="voice-controls"><button id="talk" class="voice" aria-label="Sprechen einschalten" aria-pressed="false">🎙</button></div></div></section>
<aside class="right"><section class="panel"><div class="panel-title">QUICK ACTIONS <span>04</span></div><button class="action" id="note-open"><span>＋</span><div>Notiz erstellen<small>Lokal auf diesem Gerät</small></div><b>↗</b></button><button class="action" id="timer"><span>◷</span><div>Fokus-Timer<small id="timer-label">25 Minuten für dich</small></div><b>↗</b></button></section>
<section class="panel agenda"><div class="panel-title">DEIN TAG <span id="day"></span></div><div class="empty-icon">▦</div><h3>Platz für deine Pläne.</h3><p>Deine Termine erscheinen hier,<br>sobald ein Kalender verbunden ist.</p><span class="tag">IN VORBEREITUNG</span></section>
</aside>
</main>
<dialog id="note-dialog"><form id="note-form"><div class="panel-title">DEINE NOTIZ<button type="button" id="note-close" aria-label="Schließen">✕</button></div><textarea id="note" placeholder="Was möchtest du festhalten?" aria-label="Notiz" rows="8"></textarea><p class="hint" id="save-status">Wird nur in diesem Browser gespeichert.</p><button class="pill" type="submit">Notiz speichern</button></form></dialog>
<dialog id="approval" aria-labelledby="approval-title"><h2 id="approval-title">Diesen Schritt ausführen?</h2><p id="approval-reason"></p><p id="approval-action"></p><img id="approval-image" alt="Bildschirm vor der angefragten Aktion"><div class="approval-buttons"><button id="deny" class="pill">Ablehnen</button><button id="approve" class="pill">Diesen Schritt erlauben</button></div></dialog>
<script src="head-mesh-data.js"></script><script src="head.js"></script><script src="app.js"></script><script src="api.js"></script><script src="conversation-state.js"></script><script src="conversation.js"></script></body></html>
